<style>

.sk{border-radius:var(--r-md);background:linear-gradient(90deg,var(--line),var(--surface),var(--line));background-size:200% 100%;animation:sh 1.4s infinite;margin-bottom:var(--gap);break-inside:avoid}

label{display:block;font-size:13px;color:var(--muted);margin:14px 0 5px}
input.f,textarea.f,select.f{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.res{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;width:100%;text-align:left}.res:hover,.res:focus-visible{background:var(--bg)}

.hint{font-size:13px;color:var(--muted)}

.fav{z-index:2;border:1px solid var(--line)}@media(hover:none){.fav{opacity:1}}
input.f,select.f{height:var(--h)}
.dh{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:var(--s3);margin:0 calc(var(--s5)*-1);padding:var(--s4) var(--s5) var(--s3);background:var(--surface)}
.ib.on{color:#d1355b}.dpv{border-radius:var(--r-md);overflow:hidden;margin-bottom:var(--s4)}.dpv .pv{min-height:240px;max-height:380px}
.dt{font:400 34px/1.05 var(--display);margin:var(--s4) 0 4px;overflow-wrap:anywhere}input.dt{font:400 28px var(--display);height:auto;padding:8px 12px}
.strip{display:flex;flex-direction:column;aspect-ratio:4/5}.strip span{flex:1;display:flex;align-items:flex-end;justify-content:space-between;padding:6px 12px;font-size:12px;font-weight:600;min-height:0;gap:8px}
.strip.big{aspect-ratio:auto;flex-direction:row;height:150px;border-radius:var(--r-md);overflow:hidden;margin-bottom:var(--s4)}.strip.big button{flex:1;display:flex;align-items:flex-end;padding:10px;font-size:12px;font-weight:600;text-align:left;min-width:0}
.crow{display:grid;grid-template-columns:48px 1fr 120px auto;gap:var(--s2) var(--s3);align-items:center;padding:var(--s3) 0;border-top:1px solid var(--line)}
.csw{position:relative;width:48px;height:48px;border-radius:var(--r-sm);border:1px solid var(--line);overflow:hidden}.csw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.csw:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.fm{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}.fm .tag{cursor:pointer}.fm .tag:hover{border-color:var(--muted)}
.mv{display:flex;gap:4px}.mv button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line)}
input.f[aria-invalid=true]{border-color:#a62b2b}
.fan{display:flex;justify-content:center;margin-bottom:auto;padding-top:6px}.fan i{width:52px;height:68px;border-radius:10px;border:2px solid var(--surface);margin:0 -8px}
@media(max-width:700px){.scrim:not(.mid){padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}.drawer{max-height:100%;height:100%;border-radius:var(--r-md)}.crow{grid-template-columns:48px 1fr}.crow>.hx,.crow>.mv{grid-column:1/-1}}
@media(max-width:900px){.bento{grid-template-columns:repeat(2,1fr)}.tile.w{grid-column:span 2}}
@media(max-width:700px){.app{--sw:64px}.lbl,.n,.sec,.brand span:last-child{display:none}.bento{grid-auto-rows:120px}.search kbd{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C={y:'#f3d46a',o:'#ec8a5a',m:'#bfe8cf',b:'#b4c7ec',p:'#f2b5dc',f:'#244c3a',r:'#7a2323',c:'#f6ecc0',l:'#c7b5ec'};
const TYPES={color_palette:'Colour palettes',website:'Websites',image:'Images',type:'Typography',ui:'UI components',animation:'Animation',tool:'Tools'};
const GL={color_palette:'❖',library:'◧',collections:'❏',favorites:'♥',website:'▭',image:'▣',type:'Aa',ui:'◫',animation:'◌',tool:'✦'};
/*MATH*/
const normHex=s=>{let h=String(s??'').trim().replace(/^#/,'');if(/^[0-9a-f]{3}$/i.test(h))h=[...h].map(c=>c+c).join('');return /^[0-9a-f]{6}$/i.test(h)?'#'+h.toUpperCase():null};
const toRgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const toHex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase();
// Naive sRGB->CMYK. Approximate; not a substitute for ICC-profile print conversion.
const toCmyk=([r,g,b])=>{const R=r/255,G=g/255,B=b/255,k=1-Math.max(R,G,B);if(k>=1)return[0,0,0,100];const f=x=>Math.round((1-x-k)/(1-k)*100);return[f(R),f(G),f(B),Math.round(k*100)]};
const toHsl=([r,g,b])=>{const R=r/255,G=g/255,B=b/255,mx=Math.max(R,G,B),mn=Math.min(R,G,B),d=mx-mn,l=(mx+mn)/2;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=mx===R?((G-B)/d)%6:mx===G?(B-R)/d+2:(R-G)/d+4;h*=60;if(h<0)h+=360}return[Math.round(h)%360,Math.round(s*100),Math.round(l*100)]};
const fmt=hex=>{const h=normHex(hex),c=toRgb(h),k=toCmyk(c),l=toHsl(c);return{hex:h,rgb:c,css:`rgb(${c.join(', ')})`,cmyk:`cmyk(${k[0]}%, ${k[1]}%, ${k[2]}%, ${k[3]}%)`,hsl:`hsl(${l[0]}, ${l[1]}%, ${l[2]}%)`}};
const slug=(n,i)=>String(n).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'color-'+(i+1);
const cssVars=cols=>{const u={};return':root { '+cols.map((k,i)=>{let s=slug(k.n,i);if(u[s])s+='-'+(i+1);u[s]=1;return`--palette-${s}: ${normHex(k.hex)};`}).join(' ')+' }'};
const lum=hex=>{const f=v=>(v/=255)<=.03928?v/12.92:((v+.055)/1.055)**2.4;const[r,g,b]=toRgb(hex);return .2126*f(r)+.7152*f(g)+.0722*f(b)};
const ink=hex=>lum(hex)>.4?'#1c1b17':'#fbf8ee';
const allText=p=>p.t+'\n'+p.colors.map(k=>{const f=fmt(k.hex);return`${k.n}: ${f.hex} | ${f.css} | ${f.cmyk} | ${f.hsl}`}).join('\n');
// Dominant colours: 4-bit histogram, skip transparent pixels, greedy pick by weight with a falling distance threshold (removes near-duplicates). Deterministic.
function extract(px,n=5){const B=new Map();for(let i=0;i<px.length;i+=4){if(px[i+3]<128)continue;const key=(px[i]>>4)<<8|(px[i+1]>>4)<<4|px[i+2]>>4;const b=B.get(key)||[0,0,0,0];b[0]+=px[i];b[1]+=px[i+1];b[2]+=px[i+2];b[3]++;B.set(key,b)}
 const L=[...B.entries()].map(([k,b])=>({c:[b[0]/b[3],b[1]/b[3],b[2]/b[3]],w:b[3],k})).sort((a,b)=>b.w-a.w||a.k-b.k);
 for(let t=56;t>=0;t-=8){const out=[];for(const x of L){if(out.every(y=>Math.hypot(x.c[0]-y.c[0],x.c[1]-y.c[1],x.c[2]-y.c[2])>=t))out.push(x);if(out.length===n)break}if(out.length===n||t===0)return out.map(x=>toHex(...x.c))}}
/*ENDMATH*/
const OKT=['image/png','image/jpeg','image/webp','image/gif'];
async function fromFile(f,n){if(!OKT.includes(f.type))throw Error('Unsupported file. Use PNG, JPEG, WebP or GIF.');const b=await createImageBitmap(f).catch(()=>{throw Error('That image could not be read.')});const s=Math.min(1,128/Math.max(b.width,b.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(b.width*s));cv.height=Math.max(1,Math.round(b.height*s));const x=cv.getContext('2d');x.drawImage(b,0,0,cv.width,cv.height);const r=extract(x.getImageData(0,0,cv.width,cv.height).data,n);if(!r.length)throw Error('No visible colours found in that image.');return r}
async function copy(v,l){const ae=document.activeElement;try{await navigator.clipboard.writeText(v)}catch{try{const t=document.createElement('textarea');t.value=v;t.style.cssText='position:fixed;opacity:0';document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();ae?.focus();if(!ok)throw 0}catch{toast('Copy failed. Select the value and copy it manually');return}}toast('Copied '+l)}
// ─── API Client & Data Adapters ─────────────────────────────────────────────
const API_BASE = '/api/v1';

async function apiRequest(endpoint, options = {}) {
  const url = `${API_BASE}${endpoint}`;
  const config = {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  };
  if (config.body && typeof config.body !== 'string') {
    config.body = JSON.stringify(config.body);
  }
  let res;
  try {
    res = await fetch(url, config);
  } catch (err) {
    throw new Error('Could not connect to Design Memory server.');
  }
  if (!res.ok) {
    let msg = `Server error (${res.status})`;
    try {
      const errData = await res.json();
      if (errData && errData.detail) {
        msg = typeof errData.detail === 'string' ? errData.detail : JSON.stringify(errData.detail);
      }
    } catch (_) {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  return await res.json();
}

const api = {
  getItems: (params = '') => apiRequest('/items' + (params ? '?' + params : '')),
  getItem: id => apiRequest(`/items/${id}`),
  createItem: data => apiRequest('/items', { method: 'POST', body: data }),
  updateItem: (id, data) => apiRequest(`/items/${id}`, { method: 'PATCH', body: data }),
  deleteItem: id => apiRequest(`/items/${id}`, { method: 'DELETE' }),
  toggleFavorite: id => apiRequest(`/items/${id}/favorite`, { method: 'POST' }),
  archiveItem: id => apiRequest(`/items/${id}/archive`, { method: 'POST' }),
  checkDuplicateDomain: domain => apiRequest(`/items/check/duplicate-domain?domain=${encodeURIComponent(domain)}`),
  checkDuplicate: target => apiRequest(`/items/check/duplicate?target=${encodeURIComponent(target)}`),
  extractMetadata: url => apiRequest(`/metadata/extract?url=${encodeURIComponent(url)}`),

  getCollections: () => apiRequest('/collections'),
  createCollection: data => apiRequest('/collections', { method: 'POST', body: data }),
  updateCollection: (id, data) => apiRequest(`/collections/${id}`, { method: 'PATCH', body: data }),
  deleteCollection: id => apiRequest(`/collections/${id}`, { method: 'DELETE' }),

  getTags: () => apiRequest('/tags'),
};

function fromApiItem(it) {
  const now = Date.now();
  const created = new Date(it.created_at).getTime();
  const age = Math.max(0, Math.floor((now - created) / (1000 * 60 * 60 * 24)));
  return {
    id: it.id,
    t: it.title,
    d: it.domain || (it.url ? (new URL(it.url)).hostname.replace(/^www\./, '') : 'Resource'),
    url: it.url,
    ty: it.resource_type,
    tags: it.tags || [],
    col: it.collection_ids || [],
    r: it.aspect_ratio || '4/3',
    c: it.color || '#B4C7EC',

   const cs=[C.p,C.b,C.m,C.c];
   try{
    const created=await api.createCollection({name:n.trim(),color:cs[COL.length%4]});
    COL.push(fromApiCollection(created));
    render();toast('Collection created');
   }catch(err){toast(err.message)}
  }
 }
 else if(a==='copy')copy(el.dataset.v||cssVars([it.colors[+el.dataset.i]]),el.dataset.l);
 else if(a==='cssall')copy(cssVars(it.colors),'CSS variables');
 else if(a==='copyall')copy(allText(it),'all colour values');
 else if(a==='back')drawer(S.open);
 else if(a==='addc'){
  it.colors.push({n:'Colour '+(it.colors.length+1),hex:'#8A8A8A',src:'manual'});
  try{
   await api.updateItem(it.id,{colors:it.colors.map(c=>({name:c.n,hex_value:c.hex,source:c.src}))});
   pd(it);$('#layer #c'+(it.colors.length-1))?.scrollIntoView({block:'nearest'});toast('Colour added');
  }catch(err){toast(err.message)}
 }
 else if(a==='crm'){
  if(it.colors.length<2){toast('A palette needs at least one colour');return}
  const removed=it.colors.splice(+el.dataset.i,1);
  try{
   await api.updateItem(it.id,{colors:it.colors.map(c=>({name:c.n,hex_value:c.hex,source:c.src}))});
   pd(it);
  }catch(err){
   it.colors.splice(+el.dataset.i,0,removed[0]);
   toast(err.message);
  }
 }
 else if(a==='cup'||a==='cdn'){
  const i=+el.dataset.i,j=i+(a==='cup'?-1:1);
  if(j<0||j>=it.colors.length)return;
  [it.colors[i],it.colors[j]]=[it.colors[j],it.colors[i]];
  try{
   await api.updateItem(it.id,{colors:it.colors.map(c=>({name:c.n,hex_value:c.hex,source:c.src}))});
   pd(it);$(`#layer [data-a="${a}"][data-i="${j}"]`)?.focus();
  }catch(err){
   [it.colors[i],it.colors[j]]=[it.colors[j],it.colors[i]];
   toast(err.message);
  }
 }
 else if(a==='gotoc'){const r=$('#layer #c'+el.dataset.i);r.scrollIntoView({block:'center'});r.querySelector('[data-in=chex]').focus()}
 else if(a==='pick')$('#imgin').click();
 else if(a==='ppick')$('#pimg').click();
 else if(a==='newpal')newpal();
 else if(a==='mkpal')mkpal();
 else if(a==='save'){
  if(S.saving)return;
  const u=$('#au').value.trim();let ok=true;try{const p=new URL(u);ok=/^https?:$/.test(p.protocol)}catch{ok=false}
  const m=$('#am');if(!ok){m.innerHTML='<div class="warn" role="alert">Enter a full URL starting with http:// or https://</div>';return}
  const dom=new URL(u).hostname.replace(/^www\./,'');
  let ex=null,isExact=false;
  if(!el.dataset.force){
   try{
    const dup=await api.checkDuplicate(u);
    if(dup&&dup.is_duplicate){
     ex=dup.existing_item;
     isExact=dup.is_exact_match;
    }
   }catch(_){}
  }
  if(ex&&!el.dataset.force){
   const msg=isExact?`This exact URL is already saved as “${esc(ex.t)}”.`:`${esc(dom)} is already saved as “${esc(ex.t)}”.`;
   m.innerHTML=`<div class="warn" role="alert">${msg} <button class="tag" data-a="open" data-id="${ex.id}">Open it</button> <button class="tag" data-a="save" data-force="1">Save anyway</button></div>`;
   return;
  }
  const ty=$('#ak').value;
  const palCols=[C.y,C.b,C.m,C.p,C.c];
  const payload={
   title:$('#at').value.trim()||dom,
   url:u,
   domain:dom,
   resource_type:ty,
   color:palCols[D.length%5],
   aspect_ratio:'4/3',
   notes:$('#an').value||'',
   reason_for_saving:'',
   force:!!el.dataset.force
  };
  try{
   S.saving=true;el.disabled=true;
   const created=await api.createItem(payload);
   const item=fromApiItem(created);
   item.pend=1;
   D.unshift(item);
   close();render();toast('Saved. Preview not generated yet');
  }catch(err){
   m.innerHTML=`<div class="warn" role="alert">${esc(err.message)}</div>`;
  }finally{
   S.saving=false;el.disabled=false;
  }
 }
});
document.addEventListener('input',e=>{
 const k=e.target.dataset.in;if(e.target.id==='q')return rs(e.target.value);
 const it=D.find(i=>i.id==S.open);if(!it)return;
 if(k==='why'||k==='note')it[k]=e.target.value;
 else if(k==='title'&&e.target.value.trim())it.t=e.target.value;
 else if(k==='cpick'){const c=it.colors[+e.target.dataset.i];c.hex=normHex(e.target.value);c.src='manual';e.target.parentElement.style.background=c.hex}});
document.addEventListener('change',async e=>{const t=e.target,k=t.dataset.in,it=D.find(i=>i.id==S.open),i=+t.dataset.i;
 if(k==='pimg'){$('#pf').textContent=t.files[0]?.name||'';return}if(!it)return;
 if(k==='why'||k==='note'){
  try{
   const payload=k==='note'?{notes:t.value}:{reason_for_saving:t.value};
   await api.updateItem(it.id,payload);
   it[k]=t.value;
  }catch(err){toast('Failed to save: '+err.message)}
 }
 else if(k==='title'){
  const val=t.value.trim();
  if(val){
   try{
    await api.updateItem(it.id,{title:val});
    it.t=val;render();
   }catch(err){toast('Failed to update title: '+err.message)}
  }
 }
 else if(k==='chex'){
  const h=normHex(t.value);
  if(!h){t.setAttribute('aria-invalid','true');toast('Enter a 3 or 6 digit HEX, like #263D32');return}
  it.colors[i].hex=h;it.colors[i].src='manual';
  try{
   await api.updateItem(it.id,{colors:it.colors.map(c=>({name:c.n,hex_value:c.hex,source:c.src}))});
   pd(it);
  }catch(err){toast('Failed to save colour: '+err.message)}
 }
 else if(k==='cname'){
  it.colors[i].n=t.value.trim()||it.colors[i].n;it.colors[i].src='manual';
  try{
   await api.updateItem(it.id,{colors:it.colors.map(c=>({name:c.n,hex_value:c.hex,source:c.src}))});
   pd(it);
  }catch(err){toast('Failed to save colour name: '+err.message)}
 }
 else if(k==='cpick'){
  try{
   await api.updateItem(it.id,{colors:it.colors.map(c=>({name:c.n,hex_value:c.hex,source:c.src}))});
   pd(it);
  }catch(err){toast('Failed to save colour: '+err.message)}
 }
 else if(k==='img'){
  const f=t.files[0];t.value='';if(!f)return;
  try{
   const r=await fromFile(f,+$('#ecount').value);
   r.forEach((h,j)=>it.colors.push({n:'Extracted '+(j+1),hex:h,src:'extracted'}));
   await api.updateItem(it.id,{colors:it.colors.map(c=>({name:c.n,hex_value:c.hex,source:c.src}))});
   pd(it);toast('Added '+r.length+' colours from the image');
  }catch(err){toast(err.message)}
 }
});
document.addEventListener('keydown',async e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search()}
 else if(e.key==='Escape'&&$('#layer').innerHTML)close();
 else if(e.key==='Enter'&&e.target.dataset.in==='tag'){
  const v=e.target.value.trim().toLowerCase();
  const it=D.find(i=>i.id==S.open);
  if(v&&!it.tags.includes(v)){
   const nextTags=[...it.tags,v];
   try{
    await api.updateItem(it.id,{tags:nextTags});
    it.tags=nextTags;
    drawer(it.id);render();$('#nt').focus();
   }catch(err){toast(err.message)}
  }
 }
 else if(e.key==='Tab'&&$('#layer .scrim')){const d=$('#layer [role=dialog],#layer [role=alertdialog]');const f=[...d.querySelectorAll('a[href],button:not([disabled]),input,select,textarea')].filter(x=>x.offsetParent);if(!f.length)return;const a=f[0],z=f[f.length-1],c=document.activeElement;if(!d.contains(c)){e.preventDefault();a.focus()}else if(e.shiftKey&&c===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&c===z){e.preventDefault();a.focus()}}});

async function initApp(){
 S.loading=true;
 S.loadError=null;
 render();
 try{
  const [rawItems,rawCols]=await Promise.all([api.getItems(),api.getCollections()]);
  D=rawItems.map(fromApiItem);
  COL=rawCols.map(fromApiCollection);
  S.loading=false;
  render();
 }catch(err){
  S.loading=false;
  S.loadError=err.message||'Could not load data from server.';
  render();
 }
}
initApp();
</script>
</body>
</html>
