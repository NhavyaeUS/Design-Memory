[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "design-memory-backend"
version = "0.1.0"
description = "Local backend for Design Memory personal design-reference library"
requires-python = ">=3.13"

dependencies = [
    # Web framework
    "fastapi>=0.115,<0.120",
    # ASGI server (runs FastAPI locally)
    "uvicorn[standard]>=0.30,<0.35",
    # Data validation (FastAPI uses Pydantic v2)
    "pydantic>=2.7,<3.0",
    # Settings management via environment variables
    "pydantic-settings>=2.2,<3.0",
    # ORM for database access
    "sqlalchemy>=2.0,<3.0",
    # Database migrations
    "alembic>=1.13,<2.0",
    # Serve static files (the existing HTML frontend)
    "aiofiles>=23.2,<25.0",
    # HTTP client for safe metadata extraction
    "httpx>=0.27,<0.30",
]

[project.optional-dependencies]
dev = [
    # Test runner
    "pytest>=8.2,<9.0",
    # Async test support
    "anyio[trio]>=4.4,<5.0",
    # HTTP client used by FastAPI TestClient
    "httpx>=0.27,<0.30",
    # pytest fixtures and async support
    "pytest-anyio>=0.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
